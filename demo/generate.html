<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BandwidthBridge Generator</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #9ca3af;
        --accent: #34d399;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(135deg, #020817, #0f172a 25%, #111827 100%);
        min-height: 100vh;
        color: var(--text);
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: min(900px, 92vw);
        background: rgba(15, 23, 42, 0.86);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(2rem, 3vw, 2.5rem);
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 0.92rem;
        color: var(--muted);
      }

      input, button, select {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input, select {
        padding: 12px 14px;
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
      }

      button {
        cursor: pointer;
        padding: 12px 16px;
        background: var(--accent);
        color: #06281d;
        border: none;
        font-weight: 700;
      }

      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .status {
        min-height: 24px;
        margin-top: 12px;
        color: var(--muted);
      }

      .result {
        margin-top: 16px;
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        display: none;
      }

      .result.visible { display: block; }

      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .row > * { flex: 1; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>BandwidthBridge Lecture Generator</h1>

      <div class="grid">
        <div class="row">
          <div style="flex: 2;">
            <label for="url">Lecture URL</label>
            <input id="url" type="text" value="https://www.youtube.com/watch?v=JUp_6L12l1U" />
          </div>
          <div>
            <label for="mode">Source</label>
            <select id="mode">
              <option value="youtube">YouTube</option>
              <option value="local">Local video file</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="lectureId">Lecture ID</label>
            <input id="lectureId" type="text" placeholder="optional" />
          </div>
          <div>
            <label for="maxDuration">Max duration (sec)</label>
            <input id="maxDuration" type="number" min="30" value="180" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="apiBaseInput">Backend API URL</label>
            <input id="apiBaseInput" type="text" placeholder="http://127.0.0.1:8010" />
          </div>
        </div>

        <div class="row">
          <button id="generateBtn">Generate package</button>
          <button id="fileBtn" class="secondary" type="button">Choose local file</button>
        </div>
      </div>

      <div id="status" class="status">Ready.</div>

      <div id="result" class="result">
        <h3>Package created</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
          <a id="manifestLink" target="_blank" style="color: var(--accent); font-weight: 700; text-decoration: none; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 8px;">View Manifest</a>
          <a id="playerLink" target="_blank" style="color: var(--accent); font-weight: 700; text-decoration: none; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 8px;">Open Demo Player</a>
        </div>
        <pre id="resultText"></pre>
      </div>
    </div>

    <input id="fileInput" type="file" accept="video/*" style="display:none;" />

    <script>
      function getDefaultApiBase() {
        if (window.location.origin && window.location.origin.startsWith('http')) {
          return window.location.origin;
        }
        return 'http://127.0.0.1:8010';
      }

      const apiBaseInput = document.getElementById('apiBaseInput');
      apiBaseInput.value = getDefaultApiBase();

      const urlInput = document.getElementById('url');
      const lectureIdInput = document.getElementById('lectureId');
      const maxDurationInput = document.getElementById('maxDuration');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const manifestLink = document.getElementById('manifestLink');
      const playerLink = document.getElementById('playerLink');
      const fileInput = document.getElementById('fileInput');
      const modeSelect = document.getElementById('mode');

      const searchParams = new URLSearchParams(window.location.search);
      if (searchParams.get('url')) {
        urlInput.value = searchParams.get('url');
      }
      if (searchParams.get('lectureId')) {
        lectureIdInput.value = searchParams.get('lectureId');
      }

      document.getElementById('generateBtn').addEventListener('click', async () => {
        const mode = modeSelect.value;
        const url = urlInput.value.trim();
        const file = fileInput.files?.[0] || null;
        const base = (apiBaseInput.value.trim() || getDefaultApiBase()).replace(/\/+$/, '');
        const apiUrl = `${base}/api/lectures/generate`;

        if (mode === 'youtube' && !url) {
          statusEl.textContent = 'Please provide a YouTube URL or switch to local video mode.';
          return;
        }

        if (mode === 'local' && !file && !url) {
          statusEl.textContent = 'Please choose a local video file.';
          return;
        }

        statusEl.textContent = 'Generating lecture package (extracting audio, detecting slides)...';

        try {
          const formData = new FormData();
          formData.append('source_type', mode);
          formData.append('lecture_id', lectureIdInput.value.trim() || '');
          formData.append('max_duration', String(Number(maxDurationInput.value || 0) || 0));

          if (mode === 'youtube') {
            formData.append('url', url);
          } else if (file) {
            formData.append('file', file);
            formData.append('url', file.name);
          }

          const response = await fetch(apiUrl, {
            method: 'POST',
            body: formData,
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Generation failed');
          }

          statusEl.textContent = 'Package generated successfully!';
          resultText.textContent = JSON.stringify(data, null, 2);

          const manifestPath = data.manifestUrl || `/api/lectures/${encodeURIComponent(data.lectureId)}/manifest`;
          manifestLink.href = manifestPath.startsWith('http') ? manifestPath : `${base}${manifestPath}`;
          playerLink.href = `${base}/demo/lecture.html?lectureId=${encodeURIComponent(data.lectureId)}`;

          resultEl.classList.add('visible');
        } catch (error) {
          console.error(error);
          statusEl.textContent = `Error: ${error.message}`;
        }
      });

      document.getElementById('fileBtn').addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        urlInput.value = file.name;
        lectureIdInput.value = file.name.replace(/\.[^/.]+$/, '').replace(/\s+/g, '-').toLowerCase();
        modeSelect.value = 'local';
      });
    </script>
  </body>
</html>
